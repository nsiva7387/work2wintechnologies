<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recent Feedback Videos | Admin</title><link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"></head><body><main class="admin-wrap"><a href="{{ url_for('admin') }}">← Admin dashboard</a><h1>Recent feedback videos</h1>{% if deleted %}<p class="success">Student review video deleted.</p>{% endif %}<section class="card">{% if reviews %}<div class="post-list">{% for review in reviews %}<article class="post-row review-row"><video src="{{ url_for('static', filename=review.video) }}" preload="metadata"></video><div><strong>{{ review.name }}</strong><span>{{ review.course }}</span></div><div class="post-actions"><a href="{{ url_for('student_reviews') }}" target="_blank">View</a><form method="post" action="{{ url_for('admin') }}" onsubmit="return confirm('Delete this student review video?');"><input type="hidden" name="action" value="delete-review"><input type="hidden" name="review_id" value="{{ review.id }}"><button type="submit">Delete</button></form></div></article>{% endfor %}</div>{% else %}<p>No student feedback videos yet.</p>{% endif %}</section></main></body></html>
